      <rect x="0" y="67" width="150" height="48" rx="14"/><rect x="250" y="67" width="150" height="48" rx="14"/>
      <rect x="0" y="124" width="150" height="48" rx="14"/><rect x="250" y="124" width="150" height="48" rx="14"/>
    </g>
    <g fill="#f7f8ff" text-anchor="middle">
      <text x="75" y="41">CREATED</text><text x="325" y="41">RUNNING</text>
      <text x="75" y="98">SUCCESS</text><text x="325" y="98">EVIDENCE</text>
      <text x="75" y="155">EVALUATED</text><text x="325" y="155">REPORTED</text>
    </g>
