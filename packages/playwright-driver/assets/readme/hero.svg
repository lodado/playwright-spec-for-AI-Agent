<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Playwright Driver</title>
  <desc id="desc">Direct Playwright browser driver that exposes only visible observation-local actions and captures runtime evidence.</desc>
  <rect width="1200" height="340" rx="28" fill="#08100d"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" fill="#f5fff9">
    <text x="68" y="82" font-size="24" letter-spacing="4" fill="#72df69">DIRECT BROWSER EVIDENCE</text>
    <text x="68" y="142" font-size="56" font-weight="800">Playwright Driver</text>
    <text x="68" y="188" font-size="30" fill="#c9e7d0">Visible page behavior, not DOM cheating.</text>
    <text x="68" y="292" font-size="20" fill="#93aa99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">isolated BrowserContext · origin guard · screenshot/trace/runtime issues</text>
  </g>
  <g transform="translate(640 58)">
    <rect x="0" y="0" width="430" height="220" rx="20" fill="#0e1d17" stroke="#315d37"/>
    <rect x="28" y="34" width="374" height="118" rx="14" fill="#13261f" stroke="#72df69" opacity=".9"/>
    <rect x="58" y="70" width="138" height="42" rx="10" fill="#72df69"/>
    <rect x="218" y="70" width="122" height="42" rx="10" fill="#26372d" stroke="#57745e"/>
    <path d="M63 175h305" stroke="#72df69" stroke-width="3" stroke-dasharray="10 12"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">
      <text x="74" y="98" fill="#08100d">visible CTA</text>
      <text x="236" y="98" fill="#b9d1be">blocked</text>
      <text x="72" y="204" fill="#b9d1be">selector never leaves driver</text>
    </g>
  </g>
</svg>
