name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm run qa:benchmark -- --repeat=3 --output=qa-benchmark.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-benchmark-node-${{ matrix.node-version }}
          path: qa-benchmark.json
          if-no-files-found: ignore


  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Whole pipeline against the bundled demo app with the fixture adapter:
      # no secrets, no model, no network beyond localhost.
      - run: node bin/playwright-spec-for-ai-agent.mjs demo
