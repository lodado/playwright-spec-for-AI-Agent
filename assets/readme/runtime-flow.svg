<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Persona Runtime evidence flow</title>
  <desc id="desc">Study inputs compile to browser sessions, sealed evidence, evaluation, validity, and reports.</desc>
  <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  <rect width="1200" height="360" rx="24" fill="#f8fafc"/>
  <g transform="translate(52 54)">
    <text class="mono" x="0" y="0" fill="#0369a1" font-size="18" letter-spacing="1.5">EVIDENCE PRECEDES JUDGMENT</text>
    <text class="sans" x="0" y="48" fill="#0f172a" font-size="42" font-weight="800">Code owns workflow. AI owns bounded reasoning.</text>
  </g>
  <g transform="translate(54 150)" class="sans" font-size="20" font-weight="700">
    <g><rect width="154" height="82" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/><text x="27" y="48" fill="#0c4a6e">StudySpec</text></g>
    <path d="M166 41 H226" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(236 0)"><rect width="170" height="82" rx="18" fill="#dbeafe" stroke="#93c5fd"/><text x="29" y="36" fill="#1e3a8a">Browser</text><text x="38" y="61" fill="#1e3a8a">Runtime</text></g>
    <path d="M418 41 H478" stroke="#94a3b8" stroke-width="3"/>
    <g transform="translate(488 0)"><rect width="174" height="82" rx="18" fill="#dcfce7" stroke="#86efac"/><text x="25" y="36" fill="#14532d">Evidence</text><text x="46" y="61" fill="#14532d">Bundle</text></g>
    <path d="M674 41 H734" stroke="#94a3b8" stroke-width="3"/>
    <g transform="translate(744 0)"><rect width="174" height="82" rx="18" fill="#fef3c7" stroke="#fcd34d"/><text x="34" y="36" fill="#78350f">Functional</text><text x="35" y="61" fill="#78350f">Behavioral</text></g>
    <path d="M930 41 H990" stroke="#94a3b8" stroke-width="3"/>
    <g transform="translate(1000 0)"><rect width="136" height="82" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/><text x="31" y="36" fill="#334155">JSON</text><text x="31" y="61" fill="#334155">HTML</text></g>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
  <text class="mono" x="54" y="310" fill="#64748b" font-size="18">Browser closes before evaluator runs · hidden DOM is not exposed to personas · uncalibrated results stay decision support</text>
</svg>
