      <rect x="0" y="30" width="318" height="58" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="29" cy="59" r="9" fill="#38bdf8"/>
      <text class="sans" x="52" y="66" fill="#e2e8f0" font-size="21" font-weight="700">3 personas × 3 seeds</text>
      <rect x="0" y="106" width="318" height="58" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="29" cy="135" r="9" fill="#22c55e"/>
      <text class="sans" x="52" y="142" fill="#e2e8f0" font-size="21" font-weight="700">evidence sealed first</text>
      <rect x="0" y="182" width="318" height="58" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="29" cy="211" r="9" fill="#f59e0b"/>
      <text class="sans" x="52" y="218" fill="#e2e8f0" font-size="21" font-weight="700">browserless evaluator</text>
      <path d="M28 88 V106 M28 164 V182" stroke="#475569" stroke-width="2" stroke-dasharray="6 8"/>
      <rect x="0" y="260" width="318" height="1" fill="#334155"/>
      <text class="mono" x="0" y="286" fill="#64748b" font-size="15">no conversion prediction · human gate visible</text>
    </g>
