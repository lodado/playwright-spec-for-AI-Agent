<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Persona Runtime</title>
  <desc id="desc">Evidence-first behavioral release intelligence for Playwright-era web releases.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#020617"/>
  <path d="M0 312 C240 270 355 362 580 320 C805 278 900 194 1200 240 L1200 420 L0 420 Z" fill="#0f172a" opacity=".72"/>
  <g transform="translate(58 52)">
    <text class="mono" x="0" y="0" fill="#38bdf8" font-size="19" letter-spacing="2">BEHAVIORAL RELEASE INTELLIGENCE</text>
    <text class="sans" x="0" y="76" fill="#f8fafc" font-size="64" font-weight="800">Persona Runtime</text>
    <text class="sans" x="0" y="123" fill="#cbd5e1" font-size="28">Behavioral regression testing for every product release.</text>
    <text class="sans" x="0" y="172" fill="#94a3b8" font-size="22">Policy-driven AI users try real browser tasks.</text>
    <text class="sans" x="0" y="202" fill="#94a3b8" font-size="22">Reports judge sealed evidence after the browser closes.</text>
    <g transform="translate(0 238)">
      <rect x="0" y="0" width="166" height="42" rx="21" fill="#e0f2fe"/>
      <text class="mono" x="22" y="27" fill="#082f49" font-size="18" font-weight="700">StudySpec</text>
      <rect x="184" y="0" width="186" height="42" rx="21" fill="#dbeafe"/>
      <text class="mono" x="206" y="27" fill="#1e3a8a" font-size="18" font-weight="700">Browser runs</text>
      <rect x="388" y="0" width="174" height="42" rx="21" fill="#dcfce7"/>
      <text class="mono" x="410" y="27" fill="#14532d" font-size="18" font-weight="700">Sealed proof</text>
    </g>
    <text class="mono" x="0" y="330" fill="#64748b" font-size="18">legacy package preserved · direct Playwright driver · JSON + static HTML reports</text>
  </g>
  <g transform="translate(760 50)">
    <rect x="0" y="0" width="374" height="310" rx="24" fill="url(#panel)" stroke="#334155"/>
    <g transform="translate(28 28)">
